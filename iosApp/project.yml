# El proyecto de Xcode del iPad, en 30 lineas que se pueden leer.
#
# POR QUE ESTO Y NO UN .xcodeproj EN GIT. Un proyecto de Xcode es un
# `project.pbxproj`: cientos de lineas generadas, con UUIDs de 24 caracteres,
# pensado para que lo escriba Xcode y no una persona. Aqui NADIE puede abrir
# Xcode —se trabaja en Windows— asi que ese fichero seria codigo que nadie sabe
# arreglar cuando se rompa. XcodeGen lo genera desde este YAML en el runner de
# macOS, justo antes de compilar.
#
# Decidido con Dani el 05/09/2026, y contra el principio de "menos dependencias"
# del proyecto a proposito: ese principio es sobre lo que viaja DENTRO de la app
# —Room, una libreria de red—, y XcodeGen no viaja: solo construye.

name: Lector

options:
  bundleIdPrefix: com.dani
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  Lector:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Lector
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        # SIN ESTO LA APP SE MATA SOLA AL ARRANCAR, y no es un fallo de Apple:
        # es Compose Multiplatform, que desde la 1.7 comprueba el Info.plist al
        # nacer (`PlistSanityCheck`) y llama a abort() si esta clave falta.
        #
        # Lo hacen a proposito: sin ella la interfaz se queda clavada a 60 fps en
        # las pantallas de alta frecuencia, y JetBrains prefirio romper en el
        # arranque a que nadie se enterara de por que va a medio gas.
        #
        # Costo la primera instalacion en el iPad de Dani (05/09/2026): la app
        # abria y se cerraba a los 3 segundos, con SIGABRT y esta pila:
        #   PlistSanityCheck.performIfNeeded -> ThrowException -> abort
        # El Info.plist de este proyecto se escribio a mano en vez de copiar el
        # de la plantilla de CMP, que es el unico sitio donde aparece la clave.
        CADisableMinimumFrameDurationOnPhone: true
        # LOS DOS QUE HACEN QUE SE PUEDAN METER COMICS SIN SELECTOR. Con esto,
        # la carpeta Documents de la app sale en Archivos del iPad (En mi iPad >
        # Lector) y se pueden arrastrar CBZ ahi. Es lo que lee la sonda.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dani.lector
        # Sin equipo de desarrollo y sin firmar: el .ipa sale sin firma y lo
        # firma Sideloadly con la cuenta de Dani al instalarlo. Ver el workflow.
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        # Donde esta el framework que ha dejado Gradle. La ruta es relativa al
        # .xcodeproj, que XcodeGen escribe en esta misma carpeta.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework
        # Kotlin/Native genera un framework estatico; hay que enlazarlo y
        # ademas arrastrar libresolv, que usan sus bindings de Foundation.
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Compartido
          - -lresolv
