# Compilar el proyecto en las dos plataformas.
#
# POR QUE EXISTE ESTO Y NO ES UN LUJO: desde Windows NO se puede compilar para
# iOS. Kotlin/Native necesita el enlazador y los SDK de Apple, que solo hay en
# macOS. Todo lo que hay en `iosMain` —hoy, DiscoIos— y todo `commonMain` medido
# contra el compilador de verdad de Apple se ve por primera vez AQUI.
#
# El trabajo de Android va en Ubuntu a proposito: es diez veces mas barato en
# minutos que un runner de macOS, y coge las regresiones normales, que son la
# mayoria.

name: Compilar

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:      # y a mano, desde la pestaña Actions

jobs:

  android:
    name: Android y pruebas comunes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'      # AGP 8.7 lo exige

      - uses: gradle/actions/setup-gradle@v4

      # NO HACE FALTA NINGUN SECRET PARA QUE ESTO PASE. La clave de Comic Vine
      # se lee de local.properties, que git ignora; si no esta, `secreto()`
      # devuelve "" y la app compila igual y la pide por Ajustes. El secret solo
      # hara falta el dia que se quiera un APK/IPA ya con la clave dentro.
      - name: Compilar y probar
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :shared:testDebugUnitTest --stacktrace

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS (compila y CORRE las pruebas comunes en Kotlin/Native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Esta tarea compila commonMain + iosMain + commonTest para el simulador y
      # EJECUTA las pruebas ahi. No es lo mismo que pasarlas en la JVM: se
      # comprueba que la logica se comporta igual compilada a nativo, que es
      # justo donde aparecen las diferencias de java.time, String.format y demas.
      - name: Pruebas comunes sobre el simulador
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      # EL FRAMEWORK PARA EL IPAD DE VERDAD (arm64), que es otro objetivo
      # distinto del simulador. Desde la tanda 24 se ENLAZA —ya hay `iosApp/`
      # que lo consume— y es lo que busca el proyecto de Xcode en
      # FRAMEWORK_SEARCH_PATHS. Antes esto era solo `compileKotlinIosArm64`.
      - name: El framework para el iPad
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace

      # XCODEGEN ESCRIBE EL .xcodeproj DESDE iosApp/project.yml. En git solo
      # esta el YAML: ver el porque en su cabecera.
      - name: Generar el proyecto de Xcode
        run: brew install xcodegen && cd iosApp && xcodegen generate

      # SIN FIRMAR, Y ES LO QUE SE QUIERE. Firmar exige una cuenta de
      # desarrollador de Apple metida como secret; el .ipa sin firma lo firma
      # Sideloadly con la cuenta de Dani al instalarlo en el iPad.
      - name: Compilar la app
        run: |
          cd iosApp
          xcodebuild -project Lector.xcodeproj -scheme Lector             -configuration Release -sdk iphoneos -derivedDataPath build             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             build

      # UN .ipa NO ES MAS QUE UN ZIP CON LA APP DENTRO DE UNA CARPETA `Payload`.
      # Se hace a mano porque `xcodebuild -exportArchive` pide un perfil de
      # aprovisionamiento, que es justo lo que no hay.
      - name: Empaquetar el .ipa
        run: |
          cd iosApp
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Lector.app Payload/
          zip -qry Lector.ipa Payload

      - name: Guardar el .ipa
        uses: actions/upload-artifact@v4
        with:
          name: lector-ipa
          path: iosApp/Lector.ipa
